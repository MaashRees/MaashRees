  <text x="56" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#00b8db">~/maashrees $ whoami</text>
  <text x="52" y="178" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="104" font-weight="500" letter-spacing="-4" fill="#ffffff">maashrees</text>
