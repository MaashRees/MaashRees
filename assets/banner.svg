  <rect width="1200" height="320" rx="18" fill="url(#gp)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#262626"/>

  <!-- constellation -->
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1" fill="none">
    <path d="M700 250 L770 170 L850 205 L930 110 L1000 150 L1090 80"/>
