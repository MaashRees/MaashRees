  <rect x="56" y="262" width="360" height="4" rx="2" fill="url(#line)"/>
  <text x="56" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#a1a1a1">agents · MCP · données · plateformes métier</text>
