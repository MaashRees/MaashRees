    <clipPath id="c2"><rect x="40" y="94" height="34" width="0"><animate attributeName="width" values="0;0;640;640;0" keyTimes="0;0.20;0.34;0.96;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="136" height="34" width="0"><animate attributeName="width" values="0;0;760;760;0" keyTimes="0;0.37;0.54;0.96;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="178" height="34" width="0"><animate attributeName="width" values="0;0;640;640;0" keyTimes="0;0.57;0.68;0.96;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
